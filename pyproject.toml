[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skylark_drones_assignment"
version = "0.1.0"
description = "Skylark Drones Monday.com BI Agent"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "python-dotenv",
    "jinja2",
    "pytest",
    "mangum"
]

[tool.setuptools.packages.find]
where = ["."]
